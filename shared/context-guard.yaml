# Context guard settings. Re-read whenever this file changes; a missing key uses its default.

# --- A. batched observation masking ---------------------------------------------------

# Estimated request size (latest assistant's input + cache-read tokens, plus ~chars/4 of
# what came after) at which the mask watermark moves forward. Between two moves the same
# watermark applies to every request, so the provider's prompt cache keeps hitting.
trigger_tokens: 70000

# When the watermark moves, the newest N assistant steps keep their tool output ...
keep_tool_steps: 10
# ... and the newest N keep their reasoning. 0 = never mask reasoning.
keep_reasoning_steps: 20

# A move must free at least this many tokens, or it is not worth the cache break it costs.
min_gain_tokens: 4000
# After a move (or a check that found too little to free), the next move waits until the
# request has regrown this much past the size it left. Batches moves: the recorded runs
# without it moved on every step once the unmaskable part sat above the trigger.
regrow_tokens: 10000

# Past the watermark, long string inputs of these tools are cut to their first
# keep_input_chars (a heredoc, a task prompt, a write's content); their outputs follow
# protect_tools as before.
mask_input_tools: [bash, task, write, edit]
keep_input_chars: 300

# Tools whose output is never masked.
protect_tools: [phase_checkpoint, task, question, todowrite, skill, edit, write]
# A read or bash whose path / command matches one of these regexes is never masked, and a
# read of one is never refused by the read guard below (the orchestrator reads them whole).
protect_paths:
  - 'references/work-on/phase-\d+\.md'
  - 'primary-agents/work-on\.md'
  - 'primary-agents/stub\.md'

# Agents whose context is masked (the agent of the session's first user message).
mask_agents: [work-on, stub, dossier, implementer, integration-test-author, reviewer]
# Of those, the agents whose reasoning is masked too.
mask_reasoning_agents: [work-on, stub, dossier]

# --- B. read guard --------------------------------------------------------------------

# Agents whose wasteful reads are refused (whole dossier reads, large whole-file reads
# and cats, cargo test through limactl without run_tests.py).
guard_agents: [work-on, stub]
# A read or cat without offset/limit of a file larger than this many bytes is refused.
max_read_bytes: 20000

# Bash reading windows on source and markdown (sed -n, awk NR ranges, cat/head/tail, grep
# with a context window) are refused for the guarded agents and pointed at the nav tools:
# code_item (modes contract, members, doc; several symbols as `A | B`), code_outline,
# doc_section (several headings as `a | b`) and dossier_edit.py section. Each such read was
# a turn of its own: the recorded Claude runs spent ~500 of ~1,180 orchestrator Bash calls
# on them. Read with offset and limit stays allowed as the fallback.
nav_redirect: true
# A whole-file cat/head/tail of a file this small is allowed.
nav_small_bytes: 4000
# A grep with -A/-B/-C of at least this many lines on source is a read, not a search.
nav_grep_context: 5
