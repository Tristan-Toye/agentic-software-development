    const nbrs = dir > 0 ? leftNbrs : rightNbrs;
    for (const li of range) {
      const rIdx = rowIndex();
      const existing = {};
      order[li].forEach((id, i) => { existing[id] = i; });
      order[li] = order[li].slice().sort((x, y) =>
        median(nbrs[x], rIdx, existing[x]) - median(nbrs[y], rIdx, existing[y]));
    }
  }
  for (let iter = 0; iter < 6; iter++) { sweep(1); sweep(-1); }

  let improved = true, guard = 0;
  while (improved && guard++ < 20) {
    improved = false;
    for (let li = 0; li < order.length; li++)
      for (let i = 0; i < order[li].length - 1; i++) {
        const before = totalCrossings(boundaries, rowIndex());
        [order[li][i], order[li][i + 1]] = [order[li][i + 1], order[li][i]];
        const after = totalCrossings(boundaries, rowIndex());
        if (after < before) improved = true;
        else [order[li][i], order[li][i + 1]] = [order[li][i + 1], order[li][i]];
      }
  }
  return order;
}

/* ---------------------------------------------------------------- flight plan */
{
  const groups = STAGES
    .map(s => [s, DATA.dossiers.filter(d => d.status === s)])
    .filter(([, items]) => items.length);
  if (groups.length) {
    const h = el("h2", null, "Flight plan");
    h.append(el("span", "hint", "every dossier by its recorded status · click a row for its intent"));
    app.append(enter(h));
    const panel = el("div", "panel fp");
    /* pre-build stages partition on blocked-ness: a row with every blocker
       done can start now; one with an open blocker cannot, whatever its
       status line says. Later stages are already in flight — no partition. */
    const openBlockers = d => (d.blocked_by || [])
      .filter(b => BY_ID[b] && BY_ID[b].status !== "done");
    for (const [s, items] of groups) {
      const partitions = (s === "planned" || s === "ready")
        ? [["not blocked — can start now", items.filter(d => !openBlockers(d).length)],
           ["blocked — waiting on a dossier that is not done", items.filter(d => openBlockers(d).length)]]
        : [["", items]];
      const gh = el("div", "fp-group");
      const sw = el("span", "swatch" + (ACTIVE.has(s) ? " pulse" : ""));
      sw.style.background = stageVar(s);
      gh.append(sw, el("span", "st", (s === "done" ? "✓ " : "") + s),
                el("span", "n", String(items.length)),
                el("span", null, "— " + (STATUS_GLOSS[s] || "")));
      panel.append(gh);
      for (const [label, part] of partitions) {
        if (label && part.length) panel.append(el("div", "fp-part", label));
        for (const d of part) panel.append(fpRow(d));
      }
    }
    app.append(enter(panel));
  }

  function fpRow(d) {
    const row = el("div", "fp-row");
    const dot = el("span", "fp-dot" + (ACTIVE.has(d.status) ? " pulse" : ""));
    dot.style.background = stageVar(d.status);
    const main = el("div");
    const head = el("div", "fp-head");
    head.append(el("span", "fp-id mono", d.id));
    if (d.jira) head.append(el("span", "fp-sub mono", d.jira));
    head.append(el("span", "fp-title", d.title || "(untitled)"));
    for (const f of d.flags) {
      const chip = el("span", "flag");
      const fdot = el("span", "dot");
      fdot.style.background = SEV_COLOR[f.severity] || "var(--status-warning)";
      chip.append(fdot, `${SEV_ICON[f.severity] || "⚠︎"} ${f.label}`);
      if (f.detail) bindTip(chip, () => f.detail);
      head.append(chip);
    }
    main.append(head);
    if (d.branch) main.append(el("div", "fp-sub mono", d.branch));
    row.append(dot, main, stepper(d), el("span", "fp-age", agePhrase(d.age_days)));
    if (canStart(d)) { row.classList.add("has-play"); row.append(playButton(d)); }
    row.addEventListener("click", () => openModal(d));
    return row;
  }

  /* mini lifecycle stepper: filled to the current stage in the stage ramp */
  function stepper(d) {
    const wrap = el("div", "fp-steps-wrap");
    if (d.status === "dropped") { wrap.append(el("span", "fp-sub", "dropped")); return wrap; }
    const main = STAGES.slice(0, 6);                    // planned … done
    const cur = main.indexOf(d.status);
    const steps = el("div", "fp-steps");
    main.forEach((s, i) => {
      if (i) steps.append(el("span", "step-link"));
      const st = el("span", "step" + (i <= cur ? " on" : "") + (i === cur ? " cur" : ""));
      if (i <= cur) st.style.background = stageVar(s);
      steps.append(st);
    });
    bindTip(steps, () => `status: ${d.status} — stage ${cur + 1} of ${main.length}`);
    wrap.append(steps);
    return wrap;
  }
}

} /* end non-empty branch */

/* ---------------------------------------------------------------- footer */
{
  const f = el("footer");
  const per = STAGES.filter(s => DATA.counts.by_status[s])
    .map(s => `${DATA.counts.by_status[s]} ${s}`).join(" · ");
  f.append(el("span", null, `${DATA.counts.total} dossier${DATA.counts.total === 1 ? "" : "s"}${per ? " — " + per : ""}`));
  if (DATA.parse_errors.length)
    f.append(el("span", null, `${DATA.parse_errors.length} file${DATA.parse_errors.length === 1 ? "" : "s"} with unparseable front matter: ` + DATA.parse_errors.map(e => e.file).join(", ")));
  f.append(el("span", null, `generated ${DATA.generated_at_human} — regenerate, never hand-edit`));

}

/* ---------------------------------------------------------------- modal */
const modal = document.getElementById("modal");
const sheet = modal.querySelector(".sheet");
function openModal(d) {
  if (LINK_BASE) {
    try { top.location.href = LINK_BASE + "/" + encodeURIComponent(d.id); }
    catch (e) { window.open(LINK_BASE + "/" + encodeURIComponent(d.id), "_top"); }
    return;
  }
  sheet.textContent = "";
  sheet.style.setProperty("--sheet-stage", stageVar(d.status));
  const kicker = el("div", "kicker");
  const sw = el("span", "swatch");
  sw.style.background = stageVar(d.status);
  kicker.append(sw, el("span", "st", (d.status === "done" ? "✓ " : "") + d.status));
  if (d.age_days != null) kicker.append(el("span", null, "· updated " + agePhrase(d.age_days) + (d.age_days > 0 ? " ago" : "")));
  const close = Object.assign(el("button", "close", "✕"), { title: "close" });
  close.onclick = closeModal;
  kicker.append(close);
  sheet.append(kicker);

  const h3 = el("h3");
  h3.append(el("span", "mono", d.id), d.title || "(untitled)");
  sheet.append(h3);

  sheet.append(el("h4", null, "Problem"));
  sheet.append(d.problem ? el("p", null, d.problem)
                         : el("p", "none", "No ## Problem section recorded."));
  sheet.append(el("h4", null, "Approach"));
  sheet.append(d.approach ? el("p", null, d.approach)
                          : el("p", "none", "No ## Approach section recorded."));

  const dep = (ids) => {
    const chips = el("div", "chips");
    for (const id of ids) {
      const o = BY_ID[id];
      const chip = el("span", "chip");
      const s = el("span", "swatch");
      s.style.background = o ? stageVar(o.status) : "var(--status-serious)";
      chip.append(s, `${id} · ${o ? o.status : "missing"}`);
      if (o) chip.onclick = () => openModal(o);
      chips.append(chip);
    }
    return chips;
  };
  if (d.blocked_by.length) { sheet.append(el("h4", null, "Blocked by")); sheet.append(dep(d.blocked_by)); }
  const dependents = DEPENDENTS[d.id] || [];
  if (dependents.length) { sheet.append(el("h4", null, "Unlocks")); sheet.append(dep(dependents)); }

  sheet.append(el("h4", null, "Facts"));
  const meta = el("div", "meta");
  const row = (k, v) => { if (v) { meta.append(el("b", null, k)); meta.append(Object.assign(el("span", "mono"), { textContent: String(v) })); } };
  row("status", d.status);
  row("jira", d.jira); row("branch", d.branch); row("worktree", d.worktree);
  row("pr", d.pr); row("adrs", d.adrs.join(", ")); row("file", d.file);
  row("updated", d.updated); row("created", d.created);
  sheet.append(meta);

  const hint = el("p", "none");
  hint.style.marginTop = "16px";
  hint.textContent = `Full detail: /open-work ${d.id}`;
  sheet.append(hint);

  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
}
function closeModal() { modal.classList.remove("open"); modal.setAttribute("aria-hidden", "true"); }
modal.querySelector(".backdrop").addEventListener("click", closeModal);
addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ---------------------------------------------------------------- tooltip */
const tip = document.getElementById("tip");
function bindTip(node, text) {
  node.addEventListener("mousemove", (e) => {
    tip.textContent = text();
    tip.style.display = "block";
    const w = tip.offsetWidth, x = Math.min(e.clientX + 14, innerWidth - w - 8);
    tip.style.left = x + "px";
    tip.style.top = (e.clientY + 16) + "px";
  });
  node.addEventListener("mouseleave", () => { tip.style.display = "none"; });
}
</script>
</body>
