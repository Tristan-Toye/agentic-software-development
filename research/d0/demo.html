    const gg=el('g',{'data-id':e.id,style:'cursor:pointer'},root);
    el('polyline',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',stroke:'transparent','stroke-width':12},gg);
    el('polyline',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',stroke:e.status==='context'?'var(--line)':col(e.status,1),'stroke-width':e.status==='context'?1.2:2.2,'stroke-dasharray':inf?'6 4':'0','marker-end':'url(#ar)'},gg);
    if(e.label){const m=pts[Math.floor(pts.length/2)];el('text',{x:m[0]+4,y:m[1]-4,'font-size':11,fill:'var(--mut)'},gg).textContent=e.label;}}
  for(const n of fx.nodes){const b=boxes[n.id];if(!b)continue; const gg=el('g',{'data-id':n.id,style:'cursor:pointer'},root);
    el('rect',{x:b.x,y:b.y,width:b.w,height:b.h,rx:6,fill:col(n.status),stroke:col(n.status,1),'stroke-width':2},gg);
    const lines=wrap(n.label,Math.floor((b.w-24)/6.4));
    lines.slice(0,3).forEach((t,i)=>el('text',{x:b.x+12,y:b.y+19+i*15,'font-size':12,fill:'var(--fg)'},gg).textContent=t);
    el('text',{x:b.x+b.w-8,y:b.y+b.h-7,'font-size':11,'text-anchor':'end',fill:col(n.status,1),'font-weight':700},gg).textContent=MARK[n.status]+(n.evidence.some(x=>x.tier==='inferred')?' ?':'');}
  fit();
}
function wrap(s,w){const out=[];let l='';for(const t of s.split(' ')){if((l+' '+t).trim().length>w&&l){out.push(l);l=t;}else l=(l+' '+t).trim();}if(l)out.push(l);return out;}
function apply(){root.setAttribute('transform',`translate(${vp.x} ${vp.y}) scale(${vp.k})`);}
function fit(){const r=svg.getBoundingClientRect(),{width:W,height:H}=DATA[cur].ly;const k=Math.min(r.width/(W+40),r.height/(H+40),1.6);vp={k,x:(r.width-W*k)/2,y:(r.height-H*k)/2};apply();}
let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('[data-id]'))return;drag={x:e.clientX-vp.x,y:e.clientY-vp.y};svg.setPointerCapture(e.pointerId);svg.classList.add('drag');});
svg.addEventListener('pointermove',e=>{if(!drag)return;vp.x=e.clientX-drag.x;vp.y=e.clientY-drag.y;apply();});
svg.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');});
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,f=Math.exp(-e.deltaY*0.0015),k=Math.max(0.2,Math.min(4,vp.k*f));
  vp.x=mx-(mx-vp.x)*(k/vp.k);vp.y=my-(my-vp.y)*(k/vp.k);vp.k=k;apply();},{passive:false});
svg.addEventListener('click',e=>{const t=e.target.closest('[data-id]');if(!t)return;const fx=DATA[cur].fx,id=t.dataset.id;
  const it=[...(fx.nodes),...(fx.groups||[]),...(fx.edges)].find(x=>x.id===id);if(it)inspect(it);});
function inspect(it){insp.replaceChildren();const h=document.createElement('h2');h.textContent=it.label||`${it.source} -> ${it.target}`;insp.appendChild(h);
  const add=(t,c)=>{const p=document.createElement('p');if(c)p.className=c;p.textContent=t;insp.appendChild(p);};
  add(`${it.kind} - status ${it.status}${it.resolution?' - '+it.resolution:''}`,'mut');
  if(it.detail){if(it.detail.before)add('Before: '+it.detail.before);if(it.detail.after)add('After: '+it.detail.after);}
  for(const ev of it.evidence){const p=document.createElement('p');const c=document.createElement('code');c.textContent=ev.tier==='source'?`${ev.path}${ev.line?':'+ev.line:''}`:'inferred: '+ev.note;p.appendChild(c);if(ev.note&&ev.tier==='source'){p.appendChild(document.createTextNode(' '+ev.note));}insp.appendChild(p);}}
const tabs=document.getElementById('tabs');
for(const v of ['L0','L1','L2']){const b=document.createElement('button');b.textContent=v+' '+{L0:'features',L1:'flow',L2:'crates'}[v];b.onclick=()=>{[...tabs.children].forEach(x=>x.setAttribute('aria-pressed',x===b));draw(v);};tabs.appendChild(b);}
addEventListener('resize',()=>cur&&fit()); tabs.children[2].click();
/*CANVAS-END*/
</script></body></html>
